services:
  postgres:
    image: postgres:latest
    container_name: task-management-db
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: taskAdmin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

volumes:
  postgres_data:

